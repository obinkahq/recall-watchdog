<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall Watchdog — a wallet watchdog that learns</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; color: #17202a; }
  h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; margin-top: 2rem; } .muted { color: #5d6d7e; }
  .card { border: 1px solid #d5dbdb; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .flag { border-left: 4px solid #c0392b; } .suppressed { border-left: 4px solid #229954; }
  .escalated { border-left: 4px solid #7d3c98; } .clear { border-left: 4px solid #aab7b8; }
  button { margin: 0.2rem 0.4rem 0.2rem 0; padding: 0.35rem 0.7rem; cursor: pointer; }
  code { background: #f2f3f4; padding: 0.1rem 0.3rem; border-radius: 4px; }
  .mem { font-size: 0.85rem; background: #fef9e7; border-radius: 4px; padding: 0.3rem 0.5rem; margin-top: 0.3rem; }
</style>
</head>
<body>
<h1>Recall Watchdog</h1>
<p class="muted">A watchdog for Sui wallet activity. Rules raise flags. Your verdicts are stored in Walrus Memory. Recalled verdicts then suppress or escalate later flags — with the memory shown for each decision.</p>
<h2>Live watch (Tatum)</h2>
<p id="live-meta">Loading…</p>
<p><button id="live-more">Read new transactions via Tatum</button></p>
<div id="live-list"></div>
<h2>Demo batch</h2>
<p id="meta">Loading…</p>
<p><button id="reload">Re-judge the batch</button></p>
<div id="list"></div>
<script>
const list = document.getElementById('list');
const meta = document.getElementById('meta');
const liveMeta = document.getElementById('live-meta');
const liveList = document.getElementById('live-list');
const liveMore = document.getElementById('live-more');
let liveCursor = null;
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function card(d) {
  const flags = d.flags.map(f => `<div>Flag <code>${esc(f.rule)}</code>: ${esc(f.reason)}
    <button data-pattern="${esc(f.pattern)}" data-kind="expected">Mark expected</button>
    <button data-pattern="${esc(f.pattern)}" data-kind="important">Mark important</button></div>`).join('');
  const mems = d.memories.map(m => `<div class="mem">Memory behind this decision: ${esc(m.text)}</div>`).join('');
  return `<div class="card ${esc(d.state)}" data-digest="${esc(d.digest)}" data-state="${esc(d.state)}"><strong>${esc(d.digest)}</strong> · ${esc(d.amountSui)} SUI · function ${esc(d.functionName || '-')}<br>
    Decision: <strong>${esc(d.state)}</strong> — ${esc(d.explanation)}${flags}${mems}</div>`;
}
function wireVerdicts(root) {
  root.querySelectorAll('button[data-pattern]').forEach(btn => btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Storing…';
    await fetch('/api/verdict', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ pattern: btn.dataset.pattern, kind: btn.dataset.kind, note: 'set in the web UI' }) });
    await load();
    await loadLive(false);
  }));
}
async function load() {
  const res = await fetch('/api/demo');
  const data = await res.json();
  if (!res.ok) { meta.textContent = 'Demo failed: ' + data.error; return; }
  meta.textContent = `Mode: ${data.mode} memory · Network: ${data.network} · Memories stored: ${data.memoryCount} · Active flags: ${data.activeFlags} · Suppressed: ${data.suppressedFlags} · Escalated: ${data.escalatedFlags}`;
  list.innerHTML = data.decisions.map(card).join('');
  wireVerdicts(list);
}
// Cursor page: the first call starts at the watch cursor; "Read new" asks
// only for transactions after the last nextCursor and adds them on top.
async function loadLive(next) {
  const query = next && liveCursor !== null ? `?after=${encodeURIComponent(liveCursor)}` : '';
  const res = await fetch('/api/live' + query);
  const data = await res.json();
  if (!res.ok) { liveMeta.textContent = 'Live read failed: ' + data.error; return; }
  if (!data.live) { liveMeta.textContent = data.reason; liveMore.disabled = true; return; }
  liveCursor = data.nextCursor;
  liveMeta.textContent = `Watching ${data.watchAddress} · Network: ${data.network} · Chain ${data.chainIdentifier} · Balance ${data.balanceMist} MIST · New transactions on this page: ${data.decisions.length} · Active flags: ${data.activeFlags} · Suppressed: ${data.suppressedFlags} · Escalated: ${data.escalatedFlags}`;
  const block = document.createElement('div');
  block.innerHTML = data.decisions.slice().reverse().map(card).join('');
  wireVerdicts(block);
  if (next) liveList.prepend(block); else liveList.replaceChildren(block);
}
document.getElementById('reload').addEventListener('click', load);
liveMore.addEventListener('click', () => { liveMeta.textContent = 'Reading…'; loadLive(true); });
load().catch(e => { meta.textContent = 'Load failed: ' + e.message; });
loadLive(false).catch(e => { liveMeta.textContent = 'Live read failed: ' + e.message; });
</script>
</body>
</html>
